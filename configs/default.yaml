# HBIDS experiment configuration. Every value used in the paper is set here.
seed_list: [11, 23, 47]

data:
  raw_dir: data/raw            # CSE-CIC-IDS2018 day CSVs (Kaggle mirror, solarmainframe/ids-intrusion-csv)
  days: ["02-14-2018", "02-15-2018", "02-16-2018", "02-21-2018", "02-22-2018", "03-02-2018"]
  # Per-day sampling caps (applied before the chronological split) to fit 7 GB RAM.
  # Sampling is uniform within each (day, label) group, so temporal order is preserved after re-sorting.
  max_benign_per_day: 60000
  max_attack_per_label: 20000
  # Chronological split applied separately to every (day, label) group.
  split: {train: 0.60, signature_window: 0.20, eval: 0.20}
  # Identifier columns removed to prevent shortcut learning.
  drop_columns: ["Flow ID", "Src IP", "Src Port", "Dst IP", "Timestamp"]
  # Dst Port is used only by the signature module, never as a classifier feature.
  exclude_from_ml: ["Dst Port"]

ga:                            # genetic-algorithm feature selection
  population: 16
  generations: 12
  tournament_size: 3
  crossover_rate: 0.8          # uniform crossover
  mutation_rate: null          # null -> 1 / n_features (bit flip)
  elitism: 2
  feature_penalty: 0.002       # fitness = macro-F1(validation) - penalty * n_selected
  validation_fraction: 0.25    # last 25 % (chronological) of the training portion
  fitness_model: {n_estimators: 60, max_depth: 12}   # Random Forest used inside the fitness function
  fitness_subsample: 30000

ensemble:
  mlp: {hidden_layer_sizes: [128, 64], alpha: 0.0001, learning_rate_init: 0.001, max_iter: 60, early_stopping: true, batch_size: 512}
  xgb: {n_estimators: 300, max_depth: 8, learning_rate: 0.1, subsample: 0.8, colsample_bytree: 0.8, tree_method: hist}
  rf:  {n_estimators: 200, max_depth: null, min_samples_leaf: 1, n_jobs: -1}
  vote: hard                   # majority of three; soft mean probability is used for ROC and PR curves

signatures:
  key_fields: ["Tot Fwd Pkts", "Tot Bwd Pkts", "TotLen Fwd Pkts", "TotLen Bwd Pkts", "Init Fwd Win Byts"]
  max_bin: 24                  # bin = floor(log2(1 + x)), capped
  min_support: 20              # flows with an identical key required before a signature is emitted
  validator_benign_tolerance: 0.0005   # max fraction of a validator's benign reference flows a signature may match

ledger:
  validators: 4                # n; tolerates f = floor((n-1)/3) Byzantine validators
  batch_size: 50               # signature transactions per block
  base_port: 47000

poisoning:
  n_poison_signatures: 50      # crafted from the most frequent benign keys of the malicious node

overhead:
  validator_counts: [4, 7, 10, 13]
  tx_counts: [10, 100, 1000]
  repetitions: 3
